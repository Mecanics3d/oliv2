<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bateau – barre et mesures</title>
<style>
  :root { --fond:#10161c; --carte:#1b242d; --texte:#e8eef3; --accent:#2f9bff; --ok:#3ecf74; --ko:#ff5a5a; }
  * { box-sizing: border-box; }
  body { margin:0; padding:12px; background:var(--fond); color:var(--texte);
         font-family:-apple-system,Helvetica,Arial,sans-serif; }
  h1 { font-size:20px; margin:4px 0 12px; }
  .carte { background:var(--carte); border-radius:12px; padding:14px; margin-bottom:12px; }
  button { font-size:18px; padding:14px; border:0; border-radius:10px; background:var(--accent);
           color:#fff; width:100%; }
  button:disabled { opacity:.4; }
  button.gris { background:#3a4753; }
  .ligne { display:flex; gap:10px; }
  .ligne > * { flex:1; }
  #etat { margin-top:8px; font-size:15px; }
  #angle { font-size:48px; text-align:center; margin:6px 0; }
  input[type=range] { width:100%; height:44px; }
  table { width:100%; border-collapse:collapse; font-size:18px; }
  th, td { padding:8px 4px; text-align:right; }
  th:first-child, td:first-child { text-align:left; }
  th { font-weight:normal; color:#9fb0bf; font-size:14px; }
  #cadence { font-size:13px; color:#9fb0bf; margin-top:6px; }
</style>
</head>
<body>

<h1>⛵ Bateau</h1>

<div class="carte">
  <button id="btnConnexion">Connecter la micro:bit</button>
  <div id="etat">Non connecté</div>
</div>

<div class="carte">
  <div id="angle">90°</div>
  <input type="range" id="curseur" min="45" max="135" step="1" value="90" disabled>
  <div class="ligne" style="margin-top:10px">
    <button class="gris" id="btnGauche" disabled>◀ −5°</button>
    <button class="gris" id="btnCentre" disabled>Centre</button>
    <button class="gris" id="btnDroite" disabled>+5° ▶</button>
  </div>
</div>

<div class="carte">
  <table>
    <tr><th></th><th>Instant</th><th>Maximum</th></tr>
    <tr><td>Tension</td><td id="u">–</td><td id="umax">–</td></tr>
    <tr><td>Courant</td><td id="i">–</td><td id="imax">–</td></tr>
    <tr><td>Puissance</td><td id="p">–</td><td id="pmax">–</td></tr>
  </table>
  <div id="cadence"></div>
  <button class="gris" id="btnRaz" style="margin-top:10px" disabled>Remettre les maxima à zéro</button>
</div>

<script>
// ===== RÉGLAGES (à garder cohérents avec le programme micro:bit) =====
const MINI = 45;      // butée bâbord
const MAXI = 135;     // butée tribord
const NEUTRE = 90;
const PAS = 5;        // degrés par appui sur ◀ / ▶
const PERIODE_ORDRE = 200;   // ms entre deux envois de la consigne (chien de garde micro:bit = 800 ms)

// Service UART Bluetooth de la micro:bit
const UART_SERVICE = '6e400001-b5a3-f393-e0a9-e50e24dcca9e';
const UART_RX      = '6e400002-b5a3-f393-e0a9-e50e24dcca9e'; // page -> micro:bit
const UART_TX      = '6e400003-b5a3-f393-e0a9-e50e24dcca9e'; // micro:bit -> page

let appareil = null, caractRx = null, timer = null, tampon = '';
let angle = NEUTRE;

const $ = id => document.getElementById(id);
const encodeur = new TextEncoder();
const decodeur = new TextDecoder();

function majAngle(v) {
  angle = Math.max(MINI, Math.min(MAXI, Math.round(v)));
  $('angle').textContent = angle + '°';
  $('curseur').value = angle;
}

function activer(on) {
  ['curseur','btnGauche','btnCentre','btnDroite','btnRaz'].forEach(id => $(id).disabled = !on);
}

function etat(texte, couleur) {
  $('etat').textContent = texte;
  $('etat').style.color = couleur || '';
}

async function envoyer(texte) {
  if (!caractRx) return;
  const data = encodeur.encode(texte);
  for (let i = 0; i < data.length; i += 20) {
    const morceau = data.slice(i, i + 20);
    if (caractRx.writeValueWithoutResponse) await caractRx.writeValueWithoutResponse(morceau);
    else await caractRx.writeValue(morceau);
  }
}

let occupe = false;
async function envoyerConsigne() {
  if (occupe) return;
  occupe = true;
  try { await envoyer(angle + '\n'); } catch (e) { /* liaison perdue : gérée par l'événement de déconnexion */ }
  occupe = false;
}

function lireTrame(trame) {
  trame = trame.trim();
  if (trame === 'E') {
    ['u','i','p','umax','imax','pmax'].forEach(id => $(id).textContent = '–');
    $('cadence').textContent = 'Capteur de mesure non détecté';
    return;
  }
  if (trame[0] !== 'M') return;
  const v = trame.slice(1).split(',').map(Number);
  if (v.length < 6 || v.some(isNaN)) return;
  $('u').textContent    = (v[0] / 1000).toFixed(2) + ' V';
  $('i').textContent    = (v[1] / 1000).toFixed(2) + ' A';
  $('p').textContent    = (v[2] / 1000).toFixed(2) + ' W';
  $('umax').textContent = (v[3] / 1000).toFixed(2) + ' V';
  $('imax').textContent = (v[4] / 1000).toFixed(2) + ' A';
  $('pmax').textContent = (v[5] / 1000).toFixed(2) + ' W';
  if (v.length > 6) $('cadence').textContent = v[6] + ' lectures/s';
}

function surNotification(event) {
  tampon += decodeur.decode(event.target.value);
  let n;
  while ((n = tampon.indexOf('\n')) >= 0) {
    lireTrame(tampon.slice(0, n));
    tampon = tampon.slice(n + 1);
  }
}

function surDeconnexion() {
  clearInterval(timer);
  caractRx = null;
  activer(false);
  etat('Déconnecté', 'var(--ko)');
  $('btnConnexion').textContent = 'Connecter la micro:bit';
}

async function connecter() {
  if (!navigator.bluetooth) {
    etat('Web Bluetooth indisponible : ouvrir cette page dans Bluefy', 'var(--ko)');
    return;
  }
  try {
    etat('Recherche…');
    appareil = await navigator.bluetooth.requestDevice({
      filters: [{ namePrefix: 'BBC micro:bit' }],
      optionalServices: [UART_SERVICE]
    });
    appareil.addEventListener('gattserverdisconnected', surDeconnexion);
    const serveur = await appareil.gatt.connect();
    const service = await serveur.getPrimaryService(UART_SERVICE);
    caractRx = await service.getCharacteristic(UART_RX);
    const caractTx = await service.getCharacteristic(UART_TX);
    await caractTx.startNotifications();
    caractTx.addEventListener('characteristicvaluechanged', surNotification);

    tampon = '';
    majAngle(NEUTRE);
    activer(true);
    etat('Connecté à ' + appareil.name, 'var(--ok)');
    $('btnConnexion').textContent = 'Déconnecter';
    timer = setInterval(envoyerConsigne, PERIODE_ORDRE);
  } catch (e) {
    etat('Échec : ' + e.message, 'var(--ko)');
  }
}

$('btnConnexion').addEventListener('click', () => {
  if (appareil && appareil.gatt.connected) appareil.gatt.disconnect();
  else connecter();
});
$('curseur').addEventListener('input', e => { majAngle(+e.target.value); envoyerConsigne(); });
$('btnGauche').addEventListener('click', () => { majAngle(angle - PAS); envoyerConsigne(); });
$('btnDroite').addEventListener('click', () => { majAngle(angle + PAS); envoyerConsigne(); });
$('btnCentre').addEventListener('click', () => { majAngle(NEUTRE); envoyerConsigne(); });
$('btnRaz').addEventListener('click', () => envoyer('R\n').catch(() => {}));

$('curseur').min = MINI;
$('curseur').max = MAXI;
</script>
</body>
</html>
